spring.application.name=transaction-service

spring.datasource.url=jdbc:h2:mem:transactions
spring.jpa.hibernate.ddl-auto=update

spring.graphql.graphiql.enabled=true

spring.cloud.openfeign.circuitbreaker.enabled=true

server.port=8082

clients.account-service.url=http://localhost:8081


bank.transaction.max-amount=1000

resilience4j.circuitbreaker.instances.accountService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.accountService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.accountService.waitDurationInOpenState=10s